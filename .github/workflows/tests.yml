# Runs the unit tests on every push and pull request (T3).
# Tests must not need a webcam, the MediaPipe model file, or a display.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Linux is the fast check; macOS matches most of the team's computers.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # same as environment.yml
          cache: pip
          cache-dependency-path: requirements.txt

      # OpenCV and VTK need these system libraries on a bare Linux runner.
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxrender1

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # "python -m" puts the repo root on the path so tests can import the package.
      - name: Run tests
        run: python -m pytest -v
